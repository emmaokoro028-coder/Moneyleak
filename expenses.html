<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense | MoneyLeak</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>MoneyLeak</h1>
    <p>Add your expense</p>
</header>

<main>

    <section class="form-section">

        <h2>💸 Add Expense</h2>

        <input
            type="number"
            id="expenseAmount"
            placeholder="Amount (₦)"
        >

        <input
            type="text"
            id="expenseCategory"
            placeholder="Category e.g. Food"
        >

        <button onclick="addExpense()">
            Add Expense
        </button>

        <a href="index.html" class="back-link">
            ← Back to Dashboard
        </a>

    </section>

</main>

<script>
function addExpense() {

    const amount = Number(
        document.getElementById("expenseAmount").value
    );

    const category =
        document.getElementById("expenseCategory").value;

    if (!amount || !category) {
        alert("Please enter an amount and category.");
        return;
    }

    alert("Expense added successfully!");

    document.getElementById("expenseAmount").value = "";
    document.getElementById("expenseCategory").value = "";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MoneyLeak Personal Finance OS settings and control center">
<title>Settings — MoneyLeak</title>

<link rel="stylesheet" href="style.css">

<style>

/* ============================================================
   MONEYLeak SETTINGS — PROFESSIONAL CONTROL CENTER
   ============================================================ */

:root {
    --ml-green: #07865c;
    --ml-green-dark: #045d42;
    --ml-green-soft: #eaf8f3;
    --ml-bg: #f5f8f7;
    --ml-card: #ffffff;
    --ml-border: #e2ebe7;
    --ml-text: #17231f;
    --ml-muted: #778681;
    --ml-danger: #c94b58;
    --ml-danger-bg: #fff1f2;
    --ml-sidebar: #ffffff;
}

/* RESET */

.settings-page-root,
.settings-page-root * {
    box-sizing: border-box;
}

.settings-page-root {
    margin: 0;
    background: var(--ml-bg);
    color: var(--ml-text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.settings-page-root button,
.settings-page-root input,
.settings-page-root select {
    font: inherit;
}

/* ============================================================
   SIDEBAR
   ============================================================ */

.settings-page-root .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 258px;
    height: 100vh;
    background: var(--ml-sidebar);
    border-right: 1px solid var(--ml-border);
    display: flex;
    flex-direction: column;
    z-index: 1000;
    overflow-y: auto;
}

/* BRAND */

.settings-page-root .brand {
    height: 88px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 13px;
    border-bottom: 1px solid #edf2ef;
}

.settings-page-root .brand-mark {
    width: 45px;
    height: 45px;
    flex: 0 0 45px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: linear-gradient(
        145deg,
        #099b6d,
        #056c4b
    );
    color: white;
    font-size: 20px;
    font-weight: 900;
    box-shadow:
        0 8px 20px rgba(7, 134, 92, .18);
}

.settings-page-root .brand strong {
    display: block;
    color: #14211d;
    font-size: 16px;
    line-height: 1.2;
}

.settings-page-root .brand span {
    display: block;
    margin-top: 4px;
    color: #89958f;
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .13em;
}

/* NAV */

.settings-page-root .sidebar-nav {
    padding: 24px 14px;
    display: block;
}

.settings-page-root .nav-section-title {
    padding: 0 13px;
    margin: 4px 0 9px;
    color: #9aa59f;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .16em;
}

.settings-page-root .nav-section-title:not(:first-child) {
    margin-top: 24px;
}

.settings-page-root .sidebar-nav a {
    width: 100%;
    min-height: 43px;
    padding: 0 13px;
    margin: 3px 0;
    display: flex !important;
    align-items: center;
    gap: 12px;
    border-radius: 12px;
    color: #63716b;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    transition:
        background .18s ease,
        color .18s ease,
        transform .18s ease;
}

.settings-page-root .sidebar-nav a span {
    width: 20px;
    flex: 0 0 20px;
    text-align: center;
    color: #83908a;
    font-size: 14px;
}

.settings-page-root .sidebar-nav a:hover {
    background: #f0f7f4;
    color: var(--ml-green);
    transform: translateX(2px);
}

.settings-page-root .sidebar-nav a:hover span {
    color: var(--ml-green);
}

.settings-page-root .sidebar-nav a.active {
    background: #e5f6ef;
    color: var(--ml-green-dark);
    box-shadow:
        inset 3px 0 0 var(--ml-green);
}

.settings-page-root .sidebar-nav a.active span {
    color: var(--ml-green);
}

/* SIDEBAR FOOTER */

.settings-page-root .sidebar-footer-card {
    margin: auto 14px 17px;
    padding: 16px;
    border-radius: 17px;
    background: linear-gradient(
        145deg,
        #effaf6,
        #e4f6ef
    );
    border: 1px solid #d4eee4;
}

.settings-page-root .sidebar-footer-card strong {
    display: block;
    margin-bottom: 6px;
    color: #075c43;
    font-size: 12px;
}

.settings-page-root .sidebar-footer-card span {
    display: block;
    color: #769089;
    font-size: 10px;
    line-height: 1.55;
}

/* ============================================================
   MAIN CONTENT
   ============================================================ */

.settings-page-root .main-content {
    min-height: 100vh;
    margin-left: 258px;
    background: var(--ml-bg);
}

/* TOPBAR */

.settings-page-root .topbar {
    height: 78px;
    padding: 0 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    background: rgba(255,255,255,.96);
    border-bottom: 1px solid var(--ml-border);
    position: sticky;
    top: 0;
    z-index: 900;
    backdrop-filter: blur(14px);
}

.settings-page-root .global-search-trigger {
    width: 335px;
    height: 42px;
    border: 1px solid #dce7e2;
    border-radius: 12px;
    background: #f8fbfa;
    color: #7c8984;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 13px;
    font-size: 13px;
    transition: .2s ease;
}

.settings-page-root .global-search-trigger:hover {
    border-color: #9acdbb;
    background: white;
}

.settings-page-root .global-search-trigger span {
    color: var(--ml-green);
    font-size: 17px;
}

.settings-page-root .global-search-trigger kbd {
    margin-left: auto;
    padding: 3px 7px;
    border: 1px solid #d8e2de;
    border-radius: 6px;
    background: white;
    color: #84918c;
    font-size: 10px;
}

.settings-page-root .topbar-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.settings-page-root .icon-button {
    width: 42px;
    height: 42px;
    border: 1px solid #dfe8e4;
    border-radius: 12px;
    background: white;
    cursor: pointer;
    color: #65746e;
    font-size: 17px;
    transition: .2s ease;
}

.settings-page-root .icon-button:hover {
    border-color: #9acdbb;
    color: var(--ml-green);
}

.settings-page-root .profile-chip {
    min-height: 44px;
    padding: 5px 11px 5px 6px;
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1px solid #e1eae6;
    border-radius: 13px;
    background: white;
}

.settings-page-root .profile-chip-avatar {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    background: var(--ml-green);
    color: white;
    font-size: 13px;
    font-weight: 900;
}

.settings-page-root .profile-chip strong {
    display: block;
    color: #1c2a25;
    font-size: 12px;
}

.settings-page-root .profile-chip span {
    display: block;
    margin-top: 2px;
    color: #8a9691;
    font-size: 10px;
}

/* ============================================================
   PAGE CONTAINER
   ============================================================ */

.settings-page {
    width: min(1180px, calc(100% - 50px));
    margin: 0 auto;
    padding: 42px 0 80px;
}

/* HERO */

.settings-hero {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 30px;
    margin-bottom: 30px;
}

.settings-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 12px;
    padding: 7px 11px;
    border-radius: 999px;
    background: var(--ml-green-soft);
    color: var(--ml-green);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .1em;
    text-transform: uppercase;
}

.settings-hero h1 {
    margin: 0;
    color: #17241f;
    font-size: clamp(34px, 4vw, 47px);
    line-height: 1;
    letter-spacing: -.045em;
}

.settings-hero p {
    max-width: 680px;
    margin: 12px 0 0;
    color: #75837d;
    font-size: 14px;
    line-height: 1.7;
}

.settings-status {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 11px 14px;
    background: white;
    border: 1px solid var(--ml-border);
    border-radius: 12px;
    color: #56655f;
    font-size: 11px;
    font-weight: 800;
    box-shadow: 0 8px 25px rgba(26,58,45,.04);
}

.settings-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #08a06d;
    box-shadow: 0 0 0 4px rgba(8,160,109,.10);
}

/* ============================================================
   GRID
   ============================================================ */

.settings-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 315px;
    gap: 22px;
    align-items: start;
}

.settings-main {
    display: grid;
    gap: 20px;
}

/* ============================================================
   CARDS
   ============================================================ */

.settings-card,
.summary-card,
.workspace-card {
    background: white;
    border: 1px solid var(--ml-border);
    border-radius: 20px;
    box-shadow:
        0 10px 32px rgba(28,64,49,.045);
    overflow: hidden;
}

.settings-card-header {
    padding: 23px 24px 17px;
    border-bottom: 1px solid #edf2f0;
}

.settings-card-header h2 {
    margin: 0 0 6px;
    color: #1b2924;
    font-size: 17px;
    letter-spacing: -.025em;
}

.settings-card-header p {
    margin: 0;
    color: #82908a;
    font-size: 11px;
    line-height: 1.6;
}

.settings-card-body {
    padding: 24px;
}

/* ============================================================
   PROFILE
   ============================================================ */

.profile-editor {
    display: grid;
    grid-template-columns: 78px minmax(0,1fr);
    align-items: center;
    gap: 20px;
}

.profile-large-avatar {
    width: 78px;
    height: 78px;
    display: grid;
    place-items: center;
    border-radius: 21px;
    background: linear-gradient(
        145deg,
        #0b9b6d,
        #056b4a
    );
    color: white;
    font-size: 29px;
    font-weight: 900;
    box-shadow:
        0 13px 25px rgba(7,134,92,.19);
}

.settings-label {
    display: block;
    margin-bottom: 7px;
    color: #52615b;
    font-size: 11px;
    font-weight: 900;
}

.settings-input,
.settings-select {
    width: 100%;
    height: 46px;
    padding: 0 13px;
    border: 1px solid #dce7e2;
    border-radius: 11px;
    background: #fbfdfc;
    color: #202d28;
    outline: none;
    font-size: 13px;
    transition: .2s ease;
}

.settings-input:focus,
.settings-select:focus {
    border-color: var(--ml-green);
    background: white;
    box-shadow:
        0 0 0 4px rgba(7,134,92,.08);
}

.profile-subtitle {
    margin-top: 8px;
    color: #8b9792;
    font-size: 10px;
}

/* ============================================================
   BUTTONS
   ============================================================ */

.settings-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 18px;
}

.settings-btn {
    min-height: 43px;
    padding: 0 15px;
    border: 0;
    border-radius: 11px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 900;
    transition:
        transform .18s ease,
        box-shadow .18s ease;
}

.settings-btn:hover {
    transform: translateY(-1px);
}

.settings-btn-primary {
    color: white;
    background: var(--ml-green);
    box-shadow:
        0 8px 18px rgba(7,134,92,.16);
}

.settings-btn-primary:hover {
    background: var(--ml-green-dark);
}

.settings-btn-secondary {
    color: #31564b;
    background: #edf6f2;
}

.settings-btn-danger {
    color: var(--ml-danger);
    background: var(--ml-danger-bg);
}

/* ============================================================
   PREFERENCES
   ============================================================ */

.preference-list {
    display: grid;
}

.preference-row {
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 25px;
    border-bottom: 1px solid #edf2f0;
}

.preference-row:first-child {
    padding-top: 0;
}

.preference-row:last-child {
    border-bottom: 0;
    padding-bottom: 0;
}

.preference-copy {
    min-width: 0;
}

.preference-copy strong {
    display: block;
    margin-bottom: 5px;
    color: #26352f;
    font-size: 13px;
}

.preference-copy span {
    display: block;
    max-width: 600px;
    color: #7d8b85;
    font-size: 10px;
    line-height: 1.6;
}

.preference-control {
    width: 175px;
    flex: 0 0 auto;
}

/* TOGGLE */

.toggle {
    position: relative;
    display: inline-flex;
    width: 48px;
    height: 27px;
}

.toggle input {
    position: absolute;
    opacity: 0;
}

.toggle-slider {
    width: 48px;
    height: 27px;
    border-radius: 999px;
    background: #d6e0dc;
    cursor: pointer;
    transition: .2s ease;
}

.toggle-slider::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 4px;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 2px 7px rgba(0,0,0,.14);
    transition: .2s ease;
}

.toggle input:checked + .toggle-slider {
    background: var(--ml-green);
}

.toggle input:checked + .toggle-slider::after {
    transform: translateX(21px);
}

/* ============================================================
   APPEARANCE
   ============================================================ */

.theme-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.theme-option {
    position: relative;
}

.theme-option input {
    position: absolute;
    opacity: 0;
}

.theme-card {
    min-height: 76px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 13px;
    border: 1px solid #dfe9e5;
    border-radius: 14px;
    background: #fbfdfc;
    cursor: pointer;
    transition: .2s ease;
}

.theme-card:hover {
    border-color: #9bcdbb;
    transform: translateY(-1px);
}

.theme-option input:checked + .theme-card {
    border-color: var(--ml-green);
    background: #eefaf5;
    box-shadow:
        0 0 0 3px rgba(7,134,92,.07);
}

.theme-preview {
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    font-size: 17px;
}

.theme-preview.light {
    background: white;
    border: 1px solid #e0e8e4;
}

.theme-preview.dark {
    background: #17221f;
    color: white;
}

.theme-card strong {
    display: block;
    margin-bottom: 4px;
    color: #26342f;
    font-size: 12px;
}

.theme-card small {
    color: #7e8b86;
    font-size: 10px;
}

/* ============================================================
   DATA TOOLS
   ============================================================ */

.data-tools {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
}

.data-tool {
    padding: 18px;
    text-align: left;
    border: 1px solid #e0eae6;
    border-radius: 15px;
    background: #fbfdfc;
    cursor: pointer;
    transition: .2s ease;
}

.data-tool:hover {
    border-color: #9bcdbb;
    transform: translateY(-2px);
    box-shadow:
        0 10px 25px rgba(30,80,60,.06);
}

.data-tool-icon {
    width: 39px;
    height: 39px;
    display: grid;
    place-items: center;
    margin-bottom: 12px;
    border-radius: 11px;
    background: #e8f7f1;
    color: var(--ml-green);
    font-size: 17px;
    font-weight: 900;
}

.data-tool strong {
    display: block;
    margin-bottom: 5px;
    color: #26342f;
    font-size: 12px;
}

.data-tool span {
    display: block;
    color: #7f8d87;
    font-size: 10px;
    line-height: 1.55;
}

/* ============================================================
   PRIVACY
   ============================================================ */

.privacy-box {
    display: flex;
    gap: 13px;
    padding: 16px;
    border: 1px solid #d9eee6;
    border-radius: 14px;
    background: #f0f9f5;
}

.privacy-icon {
    width: 38px;
    height: 38px;
    flex: 0 0 38px;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: #dcefe8;
    color: var(--ml-green);
    font-weight: 900;
}

.privacy-box strong {
    display: block;
    margin-bottom: 5px;
    color: #285347;
    font-size: 12px;
}

.privacy-box p {
    margin: 0;
    color: #71867e;
    font-size: 10px;
    line-height: 1.65;
}

/* ============================================================
   RIGHT SIDE
   ============================================================ */

.settings-side {
    display: grid;
    gap: 20px;
    position: sticky;
    top: 100px;
}

/* WORKSPACE CARD */

.workspace-card {
    padding: 22px;
    color: white;
    border: 0;
    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(255,255,255,.12),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #06422f,
            #087653
        );
    box-shadow:
        0 18px 35px rgba(5,74,53,.18);
}

.workspace-avatar {
    width: 53px;
    height: 53px;
    margin-bottom: 20px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    background: rgba(255,255,255,.13);
    border: 1px solid rgba(255,255,255,.14);
    font-size: 20px;
    font-weight: 900;
}

.workspace-label {
    color: rgba(255,255,255,.62);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
}

.workspace-card h3 {
    margin: 7px 0 5px;
    font-size: 20px;
    letter-spacing: -.025em;
}

.workspace-card p {
    margin: 0;
    color: rgba(255,255,255,.7);
    font-size: 10px;
}

/* SNAPSHOT */

.summary-card {
    overflow: hidden;
}

.summary-header {
    padding: 19px 20px 14px;
}

.summary-header h3 {
    margin: 0 0 4px;
    font-size: 15px;
}

.summary-header p {
    margin: 0;
    color: #8a9691;
    font-size: 10px;
}

.summary-stat {
    padding: 14px 20px;
    border-top: 1px solid #edf2f0;
}

.summary-stat span {
    display: block;
    margin-bottom: 5px;
    color: #87948f;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .06em;
    font-weight: 800;
}

.summary-stat strong {
    display: block;
    color: #25332e;
    font-size: 17px;
    letter-spacing: -.025em;
}

.summary-stat.income strong {
    color: var(--ml-green);
}

.summary-stat.expense strong {
    color: var(--ml-danger);
}

/* STATUS */

.system-status {
    padding: 0 20px 18px;
}

.system-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 11px 0;
    border-top: 1px solid #edf2f0;
}

.system-row span {
    color: #82908a;
    font-size: 10px;
}

.system-row strong {
    color: #2b3934;
    font-size: 10px;
}

.system-active {
    color: var(--ml-green) !important;
}

/* ============================================================
   DANGER
   ============================================================ */

.danger-card {
    border-color: #f0dfe1;
}

.danger-card .settings-card-header {
    background: #fffafb;
}

.danger-note {
    margin: 0;
    color: #827477;
    font-size: 11px;
    line-height: 1.7;
}

/* ============================================================
   SEARCH
   ============================================================ */

.settings-page-root .search-overlay {
    position: fixed !important;
    inset: 0 !important;
    z-index: 5000 !important;
    background: rgba(9,20,16,.52);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 105px;
}

.settings-page-root .search-overlay[hidden] {
    display: none !important;
}

.settings-page-root .search-modal {
    width: min(600px, calc(100% - 30px));
    background: white;
    border: 1px solid #dce8e3;
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
        0 30px 80px rgba(0,0,0,.22);
}

.settings-page-root .search-modal-header {
    padding: 17px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #edf2f0;
}

.settings-page-root .search-modal-header strong {
    font-size: 14px;
}

.settings-page-root .search-modal-header button {
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 9px;
    background: #f1f5f3;
    cursor: pointer;
    font-size: 20px;
}

.settings-page-root #globalSearch {
    width: calc(100% - 30px);
    height: 48px;
    margin: 15px;
    padding: 0 14px;
    border: 1px solid #dce7e2;
    border-radius: 11px;
    outline: none;
}

.settings-page-root #searchResults {
    max-height: 380px;
    overflow-y: auto;
    padding: 0 15px 15px;
}

/* ============================================================
   NOTIFICATIONS
   ============================================================ */

.settings-page-root .notification-panel {
    position: fixed !important;
    top: 90px !

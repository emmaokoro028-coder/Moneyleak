<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyLeak</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>MoneyLeak</h1>
        <p>See where your money goes. Stop the leaks.</p>
    </header>

    <main>

        <section class="balance-card">
            <p>Total Balance</p>
            <h2 id="balance">₦0</h2>
        </section>

        <section class="summary">
            <div>
                <p>Income</p>
                <h3 id="income">₦0</h3>
            </div>

            <div>
                <p>Expenses</p>
                <h3 id="expenses">₦0</h3>
            </div>
        </section>

        <section class="add-section">
            <h2>Add Transaction</h2>

            <input
                type="number"
                id="amount"
                placeholder="Amount (₦)"
            >

            <select id="type">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>

            <input
                type="text"
                id="category"
                placeholder="Category e.g. Food"
            >

            <button onclick="addTransaction()">
                Add Transaction
            </button>
        </section>

        <section class="transactions">
            <h2>Recent Transactions</h2>
            <div id="transactionList">
                <p>No transactions yet.</p>
            </div>
        </section>  
        
        <section class="leak-section">
    <h2>🚨 Money Leak</h2>

    <div id="leakMessage">
        <p>Add some expenses and MoneyLeak will find where your money is going.</p>
    </div>
</section>
    </main>

    <script src="app.js"></script>

</body>
</html>

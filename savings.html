<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MoneyLeak — Savings Goals</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6b7280;--border:#e5e7eb;--accent:#6d5dfc;--good:#16a34a;--danger:#dc2626;--shadow:0 10px 30px rgba(0,0,0,.07)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#0f1220;--card:#181c2b;--text:#f5f7ff;--muted:#aab0c0;--border:#2b3144;--shadow:0 10px 30px rgba(0,0,0,.25)}
button,input{font:inherit}button{border:0;cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--card);border-right:1px solid var(--border);padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:5}.brand{font-size:25px;font-weight:800;padding:8px 12px 25px}.brand span{color:var(--accent)}.nav a{display:block;padding:12px 14px;border-radius:12px;margin:4px 0;color:var(--muted);font-weight:600;text-decoration:none}.nav a:hover,.nav a.active{background:rgba(109,93,252,.12);color:var(--accent)}
.main{margin-left:245px;width:calc(100% - 245px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.title h1{margin:0 0 5px;font-size:30px}.title p{margin:0;color:var(--muted)}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{padding:11px 16px;border-radius:11px;font-weight:700}.primary{background:var(--accent);color:#fff}.secondary{background:var(--card);border:1px solid var(--border);color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow)}.label{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase}.value{font-size:27px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.goal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:var(--shadow);position:relative}.goal h2{margin:0 35px 5px 0;font-size:19px}.sub{color:var(--muted);font-size:13px}.goal-amount{font-size:25px;font-weight:800;margin:15px 0 8px}.progress{height:11px;background:var(--bg);border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);border-radius:99px;transition:.25s}.complete{background:var(--good)}.goal-meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;color:var(--muted);font-size:13px}.goal-actions{display:flex;gap:8px;margin-top:17px}.small{padding:8px 11px;border-radius:9px;font-weight:700}.addfund{background:rgba(109,93,252,.12);color:var(--accent)}.remove{background:transparent;color:var(--danger)}.empty{grid-column:1/-1;text-align:center;padding:55px;background:var(--card);border:1px solid var(--border);border-radius:18px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{width:min(500px,100%);background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px}.box h2{margin-top:0}.group{margin:14px 0}.group label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.group input{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:var(--bg);color:var(--text);outline:none}.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:22px;bottom:22px;background:var(--text);color:var(--bg);padding:13px 17px;border-radius:12px;display:none;z-index:30;font-weight:700}.toast.show{display:block}
@media(max-width:900px){.grid{grid-template-columns:1fr}}@media(max-width:800px){.sidebar{position:static;width:100%;height:auto;border:0;border-bottom:1px solid var(--border)}.layout{display:block}.main{margin:0;width:100%;padding:18px}.nav{display:flex;overflow-x:auto;gap:5px}.nav a{white-space:nowrap}.top{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout"><aside class="sidebar">
<div class="brand">Money<span>Leak</span></div>
<nav class="nav"><a href="index.html">Dashboard</a><a href="income.html">Income</a><a href="expenses.html">Expenses</a><a href="budgets.html">Budgets</a><a class="active" href="savings.html">Savings Goals</a><a href="recurring.html">Recurring</a><a href="analytics.html">Analytics</a><a href="settings.html">Settings</a></nav>
</aside>
<main class="main">
<div class="top"><div class="title"><h1>Savings Goals</h1><p>Turn your plans into goals and track your progress.</p></div>
<div class="actions"><button class="btn secondary" id="theme">🌙 Dark mode</button><button class="btn secondary" id="export">⬇ Backup</button><button class="btn primary" id="add">＋ New Goal</button></div></div>
<div class="stats"><div class="stat"><div class="label">Total saved</div><div class="value" id="saved">₦0</div></div><div class="stat"><div class="label">Total targets</div><div class="value" id="targets">₦0</div></div><div class="stat"><div class="label">Goals completed</div><div class="value" id="completed">0</div></div></div>
<div class="grid" id="goals"></div>
</main></div>

<div class="modal" id="modal"><div class="box">
<h2 id="modalTitle">Create savings goal</h2>
<div class="group"><label>Goal name</label><input id="name" placeholder="e.g. New Laptop"></div>
<div class="group"><label>Target amount (₦)</label><input id="target" type="number" min="1" step=".01" placeholder="300000"></div>
<div class="group"><label>Amount already saved (₦)</label><input id="initial" type="number" min="0" step=".01" placeholder="0"></div>
<div class="group"><label>Target date</label><input id="date" type="date"></div>
<div class="form-actions"><button class="btn secondary" id="cancel">Cancel</button><button class="btn primary" id="save">Create goal</button></div>
</div></div>
<div class="modal" id="fundModal"><div class="box">
<h2>Add money</h2><div class="sub" id="fundGoal"></div>
<div class="group"><label>Amount (₦)</label><input id="fundAmount" type="number" min=".01" step=".01" placeholder="10000"></div>
<div class="form-actions"><button class="btn secondary" id="fundCancel">Cancel</button><button class="btn primary" id="fundSave">Add to goal</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="moneyLeakSavingsGoals",SETTINGS="moneyLeakSettings";
function read(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):f}catch{return f}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function money(n){return"₦"+Number(n||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function toast(m){document.getElementById("toast").textContent=m;document.getElementById("toast").classList.add("show");setTimeout(()=>document.getElementById("toast").classList.remove("show"),2200)}
function applyTheme(){let s=read(SETTINGS,{});document.body.classList.toggle("dark",!!s.dark);document.getElementById("theme").textContent=s.dark?"☀️ Light mode":"🌙 Dark mode"}
function toggleTheme(){let s=read(SETTINGS,{});s.dark=!s.dark;write(SETTINGS,s);applyTheme()}
function render(){
 const goals=read(KEY,[]),totalSaved=goals.reduce((a,g)=>a+Number(g.saved||g.current||0),0),targets=goals.reduce((a,g)=>a+Number(g.target||0),0),done=goals.filter(g=>Number(g.saved||g.current||0)>=Number(g.target||0)&&Number(g.target||0)>0).length;
 document.getElementById("saved").textContent=money(totalSaved);document.getElementById("targets").textContent=money(targets);document.getElementById("completed").textContent=done;
 const box=document.getElementById("goals");box.innerHTML="";
 if(!goals.length){box.innerHTML='<div class="empty"><h2>No savings goals yet</h2><p>Create your first goal and start building toward it.</p></div>';return}
 goals.forEach(g=>{
  const saved=Number(g.saved||g.current||0),target=Number(g.target||0),pct=target?Math.min(100,saved/target*100):0,complete=pct>=100;
  const left=Math.max(0,target-saved),date=g.date||g.targetDate||"";
  const dateText=date?new Date(date+"T00:00:00").toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"}):"No deadline";
  const el=document.createElement("article");el.className="goal";
  el.innerHTML=`<h2>${esc(g.name||g.title||"Savings goal")}</h2><div class="sub">${complete?"🎉 Goal reached!":"Target date: "+esc(dateText)}</div><div class="goal-amount">${money(saved)} <span class="sub">of ${money(target)}</span></div><div class="progress"><div class="bar ${complete?"complete":""}" style="width:${pct}%"></div></div><div class="goal-meta"><span>${Math.round(pct)}% complete</span><span>${complete?"Completed":money(left)+" remaining"}</span></div><div class="goal-actions"><button class="small addfund" data-fund="${esc(String(g.id))}">＋ Add money</button><button class="small remove" data-del="${esc(String(g.id))}">Delete</button></div>`;
  box.appendChild(el);
 })
}
function openCreate(){document.getElementById("name").value="";document.getElementById("target").value="";document.getElementById("initial").value="";document.getElementById("date").value="";document.getElementById("modal").classList.add("show");document.getElementById("name").focus()}
function closeCreate(){document.getElementById("modal").classList.remove("show")}
function createGoal(){
 const name=document.getElementById("name").value.trim(),target=Number(document.getElementById("target").value),saved=Number(document.getElementById("initial").value||0),date=document.getElementById("date").value;
 if(!name){toast("Enter a goal name.");return}if(!Number.isFinite(target)||target<=0){toast("Enter a valid target.");return}if(saved<0||saved>target){toast("Initial savings must be between ₦0 and the target.");return}
 const goals=read(KEY,[]);goals.push({id:Date.now().toString(),name,target,saved,date,createdAt:new Date().toISOString()});write(KEY,goals);closeCreate();render();toast("Savings goal created.")
}
let fundingId=null;
function openFund(id){const g=read(KEY,[]).find(x=>String(x.id)===String(id));if(!g)return;fundingId=id;document.getElementById("fundGoal").textContent=(g.name||"Goal")+" • currently "+money(g.saved||0);document.getElementById("fundAmount").value="";document.getElementById("fundModal").classList.add("show");document.getElementById("fundAmount").focus()}
function closeFund(){fundingId=null;document.getElementById("fundModal").classList.remove("show")}
function addFunds(){const amount=Number(document.getElementById("fundAmount").value);if(!Number.isFinite(amount)||amount<=0){toast("Enter a valid amount.");return}const goals=read(KEY,[]),g=goals.find(x=>String(x.id)===String(fundingId));if(!g)return;g.saved=Number(g.saved||0)+amount;write(KEY,goals);closeFund();render();toast("Money added to your goal.")}
document.getElementById("add").onclick=openCreate;document.getElementById("cancel").onclick=closeCreate;document.getElementById("save").onclick=createGoal;document.getElementById("fundCancel").onclick=closeFund;document.getElementById("fundSave").onclick=addFunds;document.getElementById("theme").onclick=toggleTheme;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeCreate()};document.getElementById("fundModal").onclick=e=>{if(e.target.id==="fundModal")closeFund()};
document.getElementById("goals").onclick=e=>{const f=e.target.closest("[data-fund]"),d=e.target.closest("[data-del]");if(f)openFund(f.dataset.fund);if(d){const goals=read(KEY,[]),g=goals.find(x=>String(x.id)===String(d.dataset.del));if(g&&confirm("Delete "+(g.name||"this goal")+"?")){write(KEY,goals.filter(x=>String(x.id)!==String(d.dataset.del)));render();toast("Goal deleted.")}}};
document.getElementById("export").onclick=()=>{const backup={version:1,exportedAt:new Date().toISOString(),transactions:read("moneyLeakTransactions",[]),monthlyBudget:read("moneyLeakMonthlyBudget",0),categoryBudgets:read("moneyLeakCategoryBudgets",{}),savingsGoals:read(KEY,[]),settings:read(SETTINGS,{}),notifications:read("moneyLeakNotifications",[])};const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="moneyleak-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
applyTheme();render();
</script>
</body></html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goal | MoneyLeak</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>MoneyLeak</h1>
    <p>Build your savings goal</p>
  </header>

  <main>

    <section class="form-section">

      <h2>🎯 Savings Goal</h2>

      <label for="savingsTarget">Savings Target (₦)</label>
      <input
        type="number"
        id="savingsTarget"
        min="0"
        placeholder="Enter your savings target"
      >

      <label for="savingsSaved">Already Saved (₦)</label>
      <input
        type="number"
        id="savingsSaved"
        min="0"
        placeholder="Enter amount already saved"
      >

      <label for="savingsDays">Number of Days</label>
      <input
        type="number"
        id="savingsDays"
        min="1"
        placeholder="Enter number of days"
      >

      <button type="button" onclick="calculateGoal()">
        Calculate My Goal
      </button>

      <div id="goalResult"></div>

      <button type="button" onclick="saveSavingsGoal()">
        💾 Save Goal
      </button>

      <button type="button" onclick="resetSavingsGoal()">
        Reset Savings Goal
      </button>

      <div id="saveMessage"></div>

      <div class="savings-progress">

        <div class="progress-header">
          <strong>💰 Savings Progress</strong>
          <strong id="progressPercent">0% saved</strong>
        </div>

        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>

        <div class="progress-details">
          <span>Saved: <strong id="progressSaved">₦0</strong></span>
          <span>Target: <strong id="progressTarget">₦0</strong></span>
        </div>

        <p id="progressMessage">
          Enter your goal to start tracking.
        </p>

      </div>

      <a href="index.html" class="back-link">
        ← Back to Dashboard
      </a>

    </section>

  </main>

  <script>

    function calculateGoal() {

      const target = Number(
        document.getElementById("savingsTarget").value
      );

      const saved = Number(
        document.getElementById("savingsSaved").value
      );

      const days = Number(
        document.getElementById("savingsDays").value
      );

      if (target <= 0 || days <= 0) {
        document.getElementById("goalResult").innerHTML =
          "<p>Please enter a valid savings target and number of days.</p>";
        return;
      }

      const remaining = Math.max(target - saved, 0);
      const daily = remaining / days;
      const weekly = daily * 7;

      document.getElementById("goalResult").innerHTML = `
        <h3>Your Savings Plan</h3>
        <p>You still need <strong>₦${remaining.toLocaleString()}</strong>.</p>
        <p>Save approximately <strong>₦${daily.toLocaleString(undefined, {
          maximumFractionDigits: 2
        })}</strong> per day.</p>
        <p>That's approximately <strong>₦${weekly.toLocaleString(undefined, {
          maximumFractionDigits: 2
        })}</strong> per week.</p>
      `;

      updateProgress(target, saved);

    }


    function updateProgress(target, saved) {

      const percentage = target > 0
        ? Math.min((saved / target) * 100, 100)
        : 0;

      document.getElementById("progressPercent").textContent =
        `${Math.round(percentage)}% saved`;

      document.getElementById("progressSaved").textContent =
        `₦${saved.toLocaleString()}`;

      document.getElementById("progressTarget").textContent =
        `₦${target.toLocaleString()}`;

      document.getElementById("progressFill").style.width =
        `${percentage}%`;

      if (saved >= target && target > 0) {

        document.getElementById("progressMessage").textContent =
          "🎉 Congratulations! You've reached your savings goal!";

      } else if (saved > 0) {

        const remaining = target - saved;

        document.getElementById("progressMessage").textContent =
          `Keep going! You have ₦${remaining.toLocaleString()} left.`;

      } else {

        document.getElementById("progressMessage").textContent =
          "Enter your goal to start tracking.";

      }

    }


    function saveSavingsGoal() {

      const target = Number(
        document.getElementById("savingsTarget").value
      );

      const saved = Number(
        document.getElementById("savingsSaved").value
      );

      const days = Number(
        document.getElementById("savingsDays").value
      );

      if (target <= 0 || days <= 0) {

        document.getElementById("saveMessage").textContent =
          "Please enter a valid savings goal first.";

        return;

      }

      const goal = {
        target: target,
        saved: saved,
        days: days
      };

      localStorage.setItem(
        "moneyLeakSavingsGoal",
        JSON.stringify(goal)
      );

      updateProgress(target, saved);

      document.getElementById("saveMessage").textContent =
        "✅ Savings goal saved successfully.";

    }


    function loadSavingsGoal() {

      const storedGoal =
        localStorage.getItem("moneyLeakSavingsGoal");

      if (!storedGoal) {
        return;
      }

      try {

        const goal = JSON.parse(storedGoal);

        document.getElementById("savingsTarget").value =
          goal.target;

        document.getElementById("savingsSaved").value =
          goal.saved;

        document.getElementById("savingsDays").value =
          goal.days;

        updateProgress(goal.target, goal.saved);

      } catch (error) {

        localStorage.removeItem("moneyLeakSavingsGoal");

      }

    }


    function resetSavingsGoal() {

      localStorage.removeItem("moneyLeakSavingsGoal");

      document.getElementById("savingsTarget").value = "";
      document.getElementById("savingsSaved").value = "";
      document.getElementById("savingsDays").value = "";

      document.getElementById("goalResult").innerHTML = "";

      document.getElementById("saveMessage").textContent =
        "Savings goal reset.";

      updateProgress(0, 0);

    }


    document.addEventListener(
      "DOMContentLoaded",
      loadSavingsGoal
    );

  </script>

</body>
</html>
